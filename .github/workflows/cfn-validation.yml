name: CloudFormation Production Validation

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      stack_name:
        description: 'Stack name for pre-deployment safety checks'
        required: false
      template_file:
        description: 'Template path'
        default: 'AWESOME-template.yaml'
        required: false
      change_set_name:
        description: 'Change set name'
        default: 'predeploy-safety-check'
        required: false
      rollback_alarm_arn:
        description: 'Optional rollback alarm ARN for execution phase'
        required: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validators
        run: |
          python -m pip install --upgrade pip
          pip install cfn-lint checkov

      - name: Install cfn-guard
        run: |
          curl -L -o cfn-guard.tar.gz https://github.com/aws-cloudformation/cloudformation-guard/releases/download/3.1.2/cfn-guard-v3-x86_64-unknown-linux-musl.tar.gz
          tar -xzf cfn-guard.tar.gz
          sudo mv cfn-guard-v3-x86_64-unknown-linux-musl/cfn-guard /usr/local/bin/cfn-guard
          cfn-guard --version

      - name: Install cfn-nag
        run: |
          sudo gem install cfn-nag
          cfn_nag --version

      - name: CloudFormation lint
        run: cfn-lint AWESOME-template.yaml

      - name: CloudFormation guard policy checks
        run: cfn-guard validate -r guard-rules/production.guard -d AWESOME-template.yaml

      - name: CloudFormation security scan (Checkov)
        run: checkov -f AWESOME-template.yaml --quiet

      - name: CloudFormation security scan (cfn-nag)
        run: cfn_nag_scan --input-path AWESOME-template.yaml

  pre_deploy_safety:
    if: github.event_name == 'workflow_dispatch' && inputs.stack_name != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Validate template with CloudFormation API
        run: |
          aws cloudformation validate-template \
            --template-body file://${{ inputs.template_file }}

      - name: Create change set (do not execute)
        run: |
          aws cloudformation create-change-set \
            --stack-name "${{ inputs.stack_name }}" \
            --change-set-name "${{ inputs.change_set_name }}-${GITHUB_RUN_ID}" \
            --template-body file://${{ inputs.template_file }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --change-set-type UPDATE

      - name: Wait for change set creation
        run: |
          aws cloudformation wait change-set-create-complete \
            --stack-name "${{ inputs.stack_name }}" \
            --change-set-name "${{ inputs.change_set_name }}-${GITHUB_RUN_ID}"

      - name: Describe change set
        run: |
          aws cloudformation describe-change-set \
            --stack-name "${{ inputs.stack_name }}" \
            --change-set-name "${{ inputs.change_set_name }}-${GITHUB_RUN_ID}"

      - name: Drift detection
        run: |
          DRIFT_ID=$(aws cloudformation detect-stack-drift --stack-name "${{ inputs.stack_name }}" --query StackDriftDetectionId --output text)
          aws cloudformation wait stack-drift-detection-complete --stack-drift-detection-id "$DRIFT_ID"
          aws cloudformation describe-stack-drift-detection-status --stack-drift-detection-id "$DRIFT_ID"

      - name: Rollback alarm readiness check
        if: inputs.rollback_alarm_arn != ''
        run: |
          aws cloudwatch describe-alarms --alarm-names "$(basename '${{ inputs.rollback_alarm_arn }}')" || true
